<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | StudentDesk'">Student</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header class="topbar"><div><span class="brand-mark">S</span><strong>StudentDesk</strong></div><a class="top-link" th:href="@{/}">← Back to dashboard</a></header>
<main class="form-container"><p class="eyebrow">STUDENT RECORD</p><h1 th:text="${pageTitle}">Add student</h1><p class="muted">Enter the student's details below.</p>
<form class="form-panel" th:action="@{/students/save}" th:object="${student}" method="post">
  <input type="hidden" th:field="*{id}">
  <label>Full name<input type="text" th:field="*{name}" placeholder="e.g. Rahul Sharma"><small class="error" th:errors="*{name}"></small></label>
  <label>Email address<input type="email" th:field="*{email}" placeholder="rahul@example.com"><small class="error" th:errors="*{email}"></small></label>
  <label>Course<select th:field="*{course}"><option value="">Select a course</option><option value="BCA">BCA</option><option value="BSc">BSc</option><option value="BCom">BCom</option><option value="Engineering">Engineering</option></select><small class="error" th:errors="*{course}"></small></label>
  <label>Percentage<input type="number" min="0" max="100" step="0.01" th:field="*{percentage}" placeholder="e.g. 75.5"><small class="error" th:errors="*{percentage}"></small></label>
  <div class="criteria"><strong>Eligibility criteria</strong><span>BCA: 50% · BSc: 60% · BCom: 45% · Engineering: 70%</span></div>
  <div class="form-actions"><a class="button secondary" th:href="@{/}">Cancel</a><button class="button primary" type="submit">Save student</button></div>
</form></main></body></html>
